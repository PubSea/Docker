services:
  PostgresDbService:
    image: postgres:18.4
    container_name: local_pgdb
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - superuser_reserved_connections=5
    networks:
      - shared_network
    expose:
      - "5432"
    environment:
      POSTGRES_USER: farshad
      POSTGRES_PASSWORD: fF@123456
      POSTGRES_DB: postgres
    volumes:
      - local_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farshad"]
      interval: 10s
      timeout: 5s
      retries: 5

  PgBouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      PostgresDbService:
        condition: service_healthy
    networks:
      - shared_network
    ports:
      - "5432:5432"
    environment:
      DB_HOST: PostgresDbService
      DB_PORT: 5432
      DB_USER: farshad
      DB_PASSWORD: fF@123456
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 30
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits

volumes:
  local_pg:

networks:
  shared_network:
    external: true