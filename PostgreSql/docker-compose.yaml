services:
  PostgresDbService:
    image: postgres:18.1
    networks:
      - shared_network
    container_name: local_pgdb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: farshad
      POSTGRES_PASSWORD: fF@123456
    volumes:
      - local_pg:/var/lib/postgresql

volumes:
  local_pg:

networks:
  shared_network:
    external: true