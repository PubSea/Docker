services:
  PostgresDbService:
    image: docker.arvancloud.ir/postgres:17.4
    networks:
      - shared_network
    container_name: local_pgdb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: farshad
      POSTGRES_PASSWORD: fF@123456
    volumes:
      - local_pgdata:/var/lib/postgresql/data

volumes:
  local_pgdata:

networks:
  shared_network:
    external: true