upstream: "http://sentry-web:9000/"

relay:
  auth_token: "your_relay_auth_token_here"
  upstream: "http://sentry-web:9000/"
  host: 0.0.0.0
  port: 3000

logging:
  level: info

processing:
  enabled: true
  kafka_config:
    - {name: "bootstrap.servers", value: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"}
    - {name: "message.max.bytes", value: 50000000} # 50MB
  redis: redis://ValkeyService:6379

cors:
  allowed-origins:
    - "*"