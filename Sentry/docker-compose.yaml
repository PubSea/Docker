services:
  clickhouse:
    image: clickhouse/clickhouse-server:23
    networks:
      - shared_network
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  snuba-api:
    image: ghcr.io/getsentry/snuba:latest
    networks:
      - shared_network
    restart: unless-stopped
    ports:
      - "1218:1218"
    environment:
      SNUBA_SETTINGS: docker
      CLICKHOUSE_HOST: clickhouse
      REDIS_HOST: ValkeyService
      REDIS_PORT: 6379
      BROKER_CONFIG__BOOTSTRAP_SERVERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
      KAFKA_BOOTSTRAP_SERVERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
      DEFAULT_BROKERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
    depends_on:
      - clickhouse

    command: api

  snuba-consumer:
    image: ghcr.io/getsentry/snuba:latest
    networks:
      - shared_network
    restart: unless-stopped
    depends_on:
      - snuba-api
    environment:
      SNUBA_SETTINGS: docker
      CLICKHOUSE_HOST: clickhouse
      REDIS_HOST: ValkeyService
      REDIS_PORT: 6379
      BROKER_CONFIG__BOOTSTRAP_SERVERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
      KAFKA_BOOTSTRAP_SERVERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
      DEFAULT_BROKERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
    command: consumer --storage errors --auto-offset-reset=earliest

  sentry-web:
    image: sentry:latest
    networks:
      - shared_network
    restart: unless-stopped
    ports:
      - "9009:9000"
    environment:
      SENTRY_SECRET_KEY: "67%-3sy(dt34i1)=v!4&ivux##khy(vtbn^!#v1a7w)4t^huzu"
      SENTRY_POSTGRES_HOST: PostgresDbService
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_USER: farshad
      SENTRY_DB_PASSWORD: fF@123456
      SENTRY_DB_NAME: sentry
      SENTRY_REDIS_HOST: ValkeyService
      SENTRY_REDIS_PORT: 6379
      SENTRY_EVENT_RETENTION_DAYS: 90
    depends_on:
      - snuba-api

  sentry-worker:
    image: sentry:latest
    networks:
      - shared_network
    restart: unless-stopped
    environment:
      SENTRY_SECRET_KEY: "67%-3sy(dt34i1)=v!4&ivux##khy(vtbn^!#v1a7w)4t^huzu"
      SENTRY_POSTGRES_HOST: PostgresDbService
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_USER: farshad
      SENTRY_DB_PASSWORD: fF@123456
      SENTRY_DB_NAME: sentry
      SENTRY_REDIS_HOST: ValkeyService
      SENTRY_REDIS_PORT: 6379
      SENTRY_EVENT_RETENTION_DAYS: 90
    depends_on:
      - sentry-web

  sentry-cron:
    image: sentry:latest
    networks:
      - shared_network
    restart: unless-stopped
    environment:
      SENTRY_SECRET_KEY: "67%-3sy(dt34i1)=v!4&ivux##khy(vtbn^!#v1a7w)4t^huzu"
      SENTRY_POSTGRES_HOST: PostgresDbService
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_USER: farshad
      SENTRY_DB_PASSWORD: fF@123456
      SENTRY_DB_NAME: sentry
      SENTRY_REDIS_HOST: ValkeyService
      SENTRY_REDIS_PORT: 6379
    command: ["sentry", "run", "cron"]
    depends_on:
      - sentry-web

volumes:
  clickhouse_data:

networks:
  shared_network:
    external: true
