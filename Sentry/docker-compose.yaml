services:
  ClickhouseService:
    image: clickhouse/clickhouse-server:23
    container_name: clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - shared_network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:8123/"]
      interval: 5s
      retries: 10

  SnubaApi:
    container_name: snuba-api
    image: getsentry/snuba:24.12.1
    networks:
      - shared_network
    restart: unless-stopped
    ports:
      - "1218:1218"
    environment:
      SNUBA_SETTINGS: docker
      CLICKHOUSE_HOST: ClickhouseService
      REDIS_HOST: ValkeyService
      REDIS_PORT: 6379
      BROKER_CONFIG__BOOTSTRAP_SERVERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
      KAFKA_BOOTSTRAP_SERVERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
      DEFAULT_BROKERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
    depends_on:
      - ClickhouseService
    command: api

  SnubaConsumerService:
    container_name: snuba-consumer
    image: getsentry/snuba:24.12.1
    networks:
      - shared_network
    restart: unless-stopped
    environment:
      SNUBA_SETTINGS: docker
      CLICKHOUSE_HOST: ClickhouseService
      REDIS_HOST: ValkeyService
      REDIS_PORT: 6379
      BROKER_CONFIG__BOOTSTRAP_SERVERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
      KAFKA_BOOTSTRAP_SERVERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
      DEFAULT_BROKERS: "Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092"
    depends_on:
      - SnubaApi
    command: consumer --storage errors --auto-offset-reset=earliest

  SentryUpgradeService:
    image: getsentry/sentry:24.12.1
    networks:
      - shared_network
    environment:
      SENTRY_TSDB: ""
      SENTRY_SECRET_KEY: "67%-3sy(dt34i1)=v!4&ivux##khy(vtbn^!#v1a7w)4t^huzu"
      SENTRY_POSTGRES_HOST: PgBouncer
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_USER: farshad
      SENTRY_DB_PASSWORD: fF@123456
      SENTRY_DB_NAME: sentry
      SENTRY_REDIS_HOST: ValkeyService
      SENTRY_REDIS_PORT: 6379
    command: ["sentry", "upgrade", "--noinput"]
    depends_on:
      - SnubaApi

  SentryWebService:
    container_name: sentry-web
    image: getsentry/sentry:24.12.1
    networks:
      - shared_network
    restart: unless-stopped
    ports:
      - "9009:9000"
    environment:
      SENTRY_SECRET_KEY: "67%-3sy(dt34i1)=v!4&ivux##khy(vtbn^!#v1a7w)4t^huzu"
      SENTRY_POSTGRES_HOST: PgBouncer
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_USER: farshad
      SENTRY_DB_PASSWORD: fF@123456
      SENTRY_DB_NAME: sentry
      SENTRY_REDIS_HOST: ValkeyService
      SENTRY_REDIS_PORT: 6379
      SENTRY_EVENT_RETENTION_DAYS: 90
      SENTRY_ALLOW_ORIGIN: "*"
    depends_on:
      - SnubaApi
      - ClickhouseService

  SentryWorkerService:
    container_name: sentry-worker
    image: getsentry/sentry:24.12.1
    networks:
      - shared_network
    restart: unless-stopped
    environment:
      SENTRY_SECRET_KEY: "67%-3sy(dt34i1)=v!4&ivux##khy(vtbn^!#v1a7w)4t^huzu"
      SENTRY_POSTGRES_HOST: PgBouncer
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_USER: farshad
      SENTRY_DB_PASSWORD: fF@123456
      SENTRY_DB_NAME: sentry
      SENTRY_REDIS_HOST: ValkeyService
      SENTRY_REDIS_PORT: 6379
      SENTRY_EVENT_RETENTION_DAYS: 90
    depends_on:
      - SentryWebService

  SentryCronService:
    container_name: sentry-cron
    image: getsentry/sentry:24.12.1
    networks:
      - shared_network
    restart: unless-stopped
    environment:
      SENTRY_SECRET_KEY: "67%-3sy(dt34i1)=v!4&ivux##khy(vtbn^!#v1a7w)4t^huzu"
      SENTRY_POSTGRES_HOST: PgBouncer
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_USER: farshad
      SENTRY_DB_PASSWORD: fF@123456
      SENTRY_DB_NAME: sentry
      SENTRY_REDIS_HOST: ValkeyService
      SENTRY_REDIS_PORT: 6379
    depends_on:
      - SentryWebService
    command: ["sentry", "run", "cron"]

  SentryRelayService:
    container_name: sentry-relay
    image: getsentry/relay:24.12.1
    networks:
      - shared_network
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./relay:/work/.relay
      # - ./relay/credentials.json:/work/.relay/credentials.json
    depends_on:
      - SentryWebService
      - SentryWorkerService
      - SentryCronService

volumes:
  clickhouse_data:

networks:
  shared_network:
    external: true

