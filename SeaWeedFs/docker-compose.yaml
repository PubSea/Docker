services:

  seaweed-master-1:
    image: chrislusf/seaweedfs:4.35
    container_name: seaweed-master-1
    restart: unless-stopped
    command: >
      master
      -ip=seaweed-master-1
      -mdir=/data
      -peers=seaweed-master-1:9333,seaweed-master-2:9333,seaweed-master-3:9333
      -defaultReplication=001
    ports:
      - "1101:9333"
    volumes:
      - seaweed_master1_data:/data
    networks:
      - shared_network

  seaweed-master-2:
    image: chrislusf/seaweedfs:4.35
    container_name: seaweed-master-2
    restart: unless-stopped
    command: >
      master
      -ip=seaweed-master-2
      -mdir=/data
      -peers=seaweed-master-1:9333,seaweed-master-2:9333,seaweed-master-3:9333
      -defaultReplication=001
    volumes:
      - seaweed_master2_data:/data
    networks:
      - shared_network

  seaweed-master-3:
    image: chrislusf/seaweedfs:4.35
    container_name: seaweed-master-3
    restart: unless-stopped
    command: >
      master
      -ip=seaweed-master-3
      -mdir=/data
      -peers=seaweed-master-1:9333,seaweed-master-2:9333,seaweed-master-3:9333
      -defaultReplication=001
    volumes:
      - seaweed_master3_data:/data
    networks:
      - shared_network

  seaweed-volume-1:
    image: chrislusf/seaweedfs:4.35
    container_name: seaweed-volume-1
    restart: unless-stopped
    depends_on:
      - seaweed-master-1
      - seaweed-master-2
      - seaweed-master-3
    command: >
      volume
      -mserver=seaweed-master-1:9333,seaweed-master-2:9333,seaweed-master-3:9333
      -ip=seaweed-volume-1
      -dir=/data
      -max=100
    volumes:
      - seaweed_volume1_data:/data
    networks:
      - shared_network

  seaweed-volume-2:
    image: chrislusf/seaweedfs:4.35
    container_name: seaweed-volume-2
    restart: unless-stopped
    depends_on:
      - seaweed-master-1
      - seaweed-master-2
      - seaweed-master-3
    command: >
      volume
      -mserver=seaweed-master-1:9333,seaweed-master-2:9333,seaweed-master-3:9333
      -ip=seaweed-volume-2
      -dir=/data
      -max=100
    volumes:
      - seaweed_volume2_data:/data
    networks:
      - shared_network

  seaweed-volume-3:
    image: chrislusf/seaweedfs:4.35
    container_name: seaweed-volume-3
    restart: unless-stopped
    depends_on:
      - seaweed-master-1
      - seaweed-master-2
      - seaweed-master-3
    command: >
      volume
      -mserver=seaweed-master-1:9333,seaweed-master-2:9333,seaweed-master-3:9333
      -ip=seaweed-volume-3
      -dir=/data
      -max=100
    volumes:
      - seaweed_volume3_data:/data
    networks:
      - shared_network

  seaweed-filer:
    image: chrislusf/seaweedfs:4.35
    container_name: seaweed-filer
    restart: unless-stopped
    depends_on:
      - seaweed-volume-1
      - seaweed-volume-2
      - seaweed-volume-3
    command: >
      filer
      -master=seaweed-master-1:9333,seaweed-master-2:9333,seaweed-master-3:9333
    ports:
      - "1110:8888"
    volumes:
      - ./filer.toml:/etc/seaweedfs/filer.toml:ro
    networks:
      - shared_network

  seaweed-s3:
    image: chrislusf/seaweedfs:4.35
    container_name: seaweed-s3
    restart: unless-stopped
    depends_on:
      - seaweed-filer
    command: >
      s3
      -filer=seaweed-filer:8888
      -port=8333
      -config=/etc/seaweedfs/s3.json
    ports:
      - "1120:8333"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - shared_network

volumes:
  seaweed_master1_data:
  seaweed_master2_data:
  seaweed_master3_data:

  seaweed_volume1_data:
  seaweed_volume2_data:
  seaweed_volume3_data:

networks:
  shared_network:
    external: true
