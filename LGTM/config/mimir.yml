multitenancy_enabled: false

server:
  http_listen_port: 9009

blocks_storage:
  backend: s3
  bucket_store:
    sync_dir: /data/mimir/bucket-store
  tsdb:
    dir: /data/mimir/tsdb

  s3:
    endpoint: seaweed-s3:8333
    bucket_name: mimir-blocks
    access_key_id: admin
    secret_access_key: farshad123456
    insecure: true
    native_aws_auth_enabled: false

ruler_storage:
  backend: s3

  s3:
    endpoint: seaweed-s3:8333
    bucket_name: mimir-ruler
    access_key_id: admin
    secret_access_key: farshad123456
    insecure: true
    native_aws_auth_enabled: false

alertmanager_storage:
  backend: s3

  s3:
    endpoint: seaweed-s3:8333
    bucket_name: mimir-alertmanager
    access_key_id: admin
    secret_access_key: farshad123456
    insecure: true
    native_aws_auth_enabled: false

compactor:
  data_dir: /data/mimir/compactor

alertmanager:
  data_dir: /data/mimir/alertmanager

ingester:
  ring:
    replication_factor: 1

limits:
  # Required to store the native histograms Tempo sends (used for P99/P99.9)
  native_histograms_ingestion_enabled: true
  # Store exemplars so you can jump from a latency spike to the trace
  max_global_exemplars_per_user: 100000
