[server]
root_url = http://grafana:3000

[auth]
login_maximum_inactive_lifetime_duration = 8h
login_maximum_lifetime_duration = 24h

[auth.github]
enabled = false

[auth.gitlab]
enabled = false

[auth.google]
enabled = false

[auth.generic_oauth]
enabled = true
name = Sea
allow_sign_up = true

client_id = graf__client
client_secret = 12345678
use_pkce = true

scopes = openid profile roles

tls_skip_verify_insecure = true
auth_url = https://accounts.sea.local/connect/authorize
token_url = https://accounts.sea.local/connect/token
api_url = https://accounts.sea.local/connect/userinfo
signout_redirect_url = https://accounts.sea.local/connect/endsession?post_logout_redirect_uri=https%3A%2F%2Fmonitoring.sea.local%2Flogin

login_attribute_path = preferred_username
name_attribute_path = name
email_attribute_path = preferred_username

role_attribute_path = contains(role, 'grafana_admin') && 'Admin' || 'Viewer'