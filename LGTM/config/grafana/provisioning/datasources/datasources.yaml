apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # trace_id is OTLP structured metadata -> clickable link to the trace in Tempo
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: 'View trace'

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        # Logs arrive via Loki's OTLP endpoint: label service_name, trace_id/span_id as structured metadata
        tags:
          - key: service.name
            value: service_name
        customQuery: true
        query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: '-10m'
        spanEndTimeShift: '10m'
        # Tempo span-metrics label the service as "service" (not service_name).
        # $__tags is replaced with service="<span's service.name>".
        tags:
          - key: service.name
            value: service
        # Only SERVER spans = real incoming requests (DB / downstream child spans excluded).
        # Latency uses the NATIVE histogram (no _bucket suffix, no "by (le)"),
        # which gives accurate high percentiles such as P99.9.
        queries:
        - name: Request Rate
          query: sum(rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", $$__tags}[5m]))
        - name: Error Rate
          query: sum(rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", $$__tags}[5m]))
        - name: P50
          query: histogram_quantile(0.50, sum(rate(traces_spanmetrics_latency{span_kind="SPAN_KIND_SERVER", $$__tags}[5m])))
        - name: P75
          query: histogram_quantile(0.75, sum(rate(traces_spanmetrics_latency{span_kind="SPAN_KIND_SERVER", $$__tags}[5m])))
        - name: P90
          query: histogram_quantile(0.90, sum(rate(traces_spanmetrics_latency{span_kind="SPAN_KIND_SERVER", $$__tags}[5m])))
        - name: P95
          query: histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency{span_kind="SPAN_KIND_SERVER", $$__tags}[5m])))
        - name: P99
          query: histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency{span_kind="SPAN_KIND_SERVER", $$__tags}[5m])))
        - name: P99.9
          query: histogram_quantile(0.999, sum(rate(traces_spanmetrics_latency{span_kind="SPAN_KIND_SERVER", $$__tags}[5m])))
        - name: P99.99
          query: histogram_quantile(0.9999, sum(rate(traces_spanmetrics_latency{span_kind="SPAN_KIND_SERVER", $$__tags}[5m])))

  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: false
    jsonData:
      prometheusType: Mimir
      httpMethod: POST
      cacheLevel: 'None'
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: traceID   # exemplar label Tempo's span-metrics use
          datasourceUid: tempo
