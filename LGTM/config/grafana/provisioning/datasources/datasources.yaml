apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: true
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} |= "$${__trace.traceId}" |= "$${__span.spanId}"'
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: '-10m'
        spanEndTimeShift: '10m'
        queries:
        - name: Request Rate
          query: sum(rate(traces_spanmetrics_calls_total{service_name="$${__span.tags["service.name"]}"}[5m]))
        - name: Error Rate
          query: sum(rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR", service_name="$${__span.tags["service.name"]}"}[5m]))
        - name: P50
          query: histogram_quantile(0.50, sum(rate(traces_spanmetrics_latency_bucket{service_name="$${__span.tags["service.name"]}"}[5m])) by (le))
        - name: P75
          query: histogram_quantile(0.75, sum(rate(traces_spanmetrics_latency_bucket{service_name="$${__span.tags["service.name"]}"}[5m])) by (le))
        - name: P90
          query: histogram_quantile(0.90, sum(rate(traces_spanmetrics_latency_bucket{service_name="$${__span.tags["service.name"]}"}[5m])) by (le))
        - name: P95
          query: histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{service_name="$${__span.tags["service.name"]}"}[5m])) by (le))
        - name: P99
          query: histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket{service_name="$${__span.tags["service.name"]}"}[5m])) by (le))
        - name: P99.9
          query: histogram_quantile(0.999, sum(rate(traces_spanmetrics_latency_bucket{service_name="$${__span.tags["service.name"]}"}[5m])) by (le))

  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: false
    jsonData:
      prometheusType: Mimir
      httpMethod: POST
      cacheLevel: 'None'
      timeInterval: 15s
