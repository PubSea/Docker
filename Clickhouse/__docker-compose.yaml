x-restart-policy: &restart_policy
  restart: unless-stopped

services:
  ClickhouseService:
    <<: *restart_policy
    image: altinity/clickhouse-server:25.3.6.10034.altinitystable
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: farshad
      CLICKHOUSE_PASSWORD: fF@123456
    ports:
      - "8123:8123"
      - "8124:9000"
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/logs:/var/log/clickhouse-server
    networks:
      - shared_network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:8123/"]
      interval: 5s
      retries: 10

networks:
  shared_network:
    external: true

