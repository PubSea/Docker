# =============================================================================
# Accounts, users and permissions. This file contains NO secrets.
#
# The *_PASSWORD_HASH variables are bcrypt hashes defined in
# secrets/credentials.conf, which scripts/credentials.sh generates (gitignored)
# and Compose mounts as a secret. To add a user: add it here with the narrowest
# permissions that work, add its name to scripts/credentials.sh, run the
# script, then reload: docker compose kill -s SIGHUP nats-1 nats-2 nats-3
#
# Anonymous access is impossible: no no_auth_user is configured.
# =============================================================================
include "secrets/credentials.conf"

# The system account carries server/cluster administration ($SYS.>): server
# reports, health checks, peer removal. Only operators get these credentials.
system_account: SYS

accounts {
  SYS {
    users: [
      {
        user: "sys-admin"
        password: $SYS_ADMIN_PASSWORD_HASH
        allowed_connection_types: ["STANDARD"]
      }
    ]
  }

  # Application account: every application stream and consumer lives here.
  APP {
    jetstream {
      # Un-tiered account limits count replicas x bytes: a 1 GiB R3 stream
      # consumes 3 GiB of max_file. Sizing assumptions are in README.md.
      max_memory: 512MB
      max_file: 24GB
      max_streams: 100
      # Per stream (same as the 2.15 default_max_consumers).
      max_consumers: 1000
      # Refuse streams without a max_bytes limit, so one runaway stream cannot
      # fill the shared disk.
      max_bytes_required: true
    }

    users: [
      # JetStream administration for this account: create/edit/delete streams
      # and consumers, backups and restores. Used by scripts/ via nats-box.
      {
        user: "app-admin"
        password: $APP_ADMIN_PASSWORD_HASH
        allowed_connection_types: ["STANDARD"]
      }

      # Example producer: may publish orders.> events and receive JetStream
      # publish acknowledgements on its own inbox prefix, nothing else. It
      # cannot touch the JetStream API, other subjects, or other users' inboxes.
      # Clients must set the inbox prefix (README: "Client examples").
      {
        user: "orders-publisher"
        password: $ORDERS_PUBLISHER_PASSWORD_HASH
        allowed_connection_types: ["STANDARD"]
        permissions: {
          publish: { allow: ["orders.>"] }
          subscribe: { allow: ["_INBOX_orders_publisher.>"] }
        }
      }

      # Example worker: may only read the durable pull consumer
      # ORDERS > order-processor and acknowledge its messages. It cannot create,
      # edit or delete streams or consumers, and cannot read raw subjects.
      {
        user: "orders-consumer"
        password: $ORDERS_CONSUMER_PASSWORD_HASH
        allowed_connection_types: ["STANDARD"]
        permissions: {
          publish: {
            allow: [
              "$JS.API.CONSUMER.INFO.ORDERS.order-processor"
              "$JS.API.CONSUMER.MSG.NEXT.ORDERS.order-processor"
              # v1 ack subjects (server default up to and including 2.15)
              "$JS.ACK.ORDERS.order-processor.>"
              # v2 ack subjects $JS.ACK.<domain>.<account hash>.<stream>.<consumer>...
              # (server default from 2.16, see docs.nats.io release notes 2.14/2.15)
              "$JS.ACK.*.*.ORDERS.order-processor.>"
            ]
          }
          subscribe: { allow: ["_INBOX_orders_consumer.>"] }
        }
      }
    ]
  }
}
