# =============================================================================
# NATS server configuration shared by nats-1, nats-2 and nats-3.
#
# Per-node values come from environment variables set in docker-compose.yaml:
#   NATS_SERVER_NAME    unique, stable server name (it is the JetStream peer
#                       identity: never rename a node that holds data)
#   NATS_CLUSTER_ADDR   host:port of this node on the private nats_cluster network
#   NATS_MONITOR_ADDR   host:port for HTTP monitoring, same private address
#   NATS_JS_MAX_MEMORY  JetStream memory-storage cap for this server (e.g. 512MB)
#   NATS_JS_MAX_FILE    JetStream file-storage cap for this server (e.g. 10GB)
#
# This file contains NO secrets. Password hashes, keys and certificates are
# generated locally (scripts/setup.sh), gitignored, and mounted as Compose
# secrets. Reference: https://docs.nats.io/reference/config/
# =============================================================================

server_name: $NATS_SERVER_NAME

# -----------------------------------------------------------------------------
# Client connections: TLS is mandatory, users authenticate with passwords whose
# bcrypt hashes live in secrets/credentials.conf (see accounts.conf).
# -----------------------------------------------------------------------------
listen: "0.0.0.0:4222"

tls {
  cert_file: "/etc/nats/certs/server.crt"
  key_file: "/etc/nats/certs/server.key"
  ca_file: "/etc/nats/certs/ca.crt"
  min_version: "1.2"
  timeout: 2
}

# Connection guard rails (sizing assumptions are documented in README.md).
max_connections: 10000
max_payload: 1MB
max_pending: 64MB
write_deadline: "10s"

# -----------------------------------------------------------------------------
# HTTP monitoring (/healthz, /varz, /jsz, /routez ...).
# It is plain HTTP without authentication, so it binds ONLY to this node's
# address on the private nats_cluster network: it is not reachable from
# shared_network and is never published on the host. Consumers: the Docker
# healthcheck and the prometheus-nats-exporter sidecars.
# -----------------------------------------------------------------------------
http: $NATS_MONITOR_ADDR

# -----------------------------------------------------------------------------
# Cluster (routes). Mutual TLS on the private nats_cluster network.
# -----------------------------------------------------------------------------
cluster {
  name: "pubsea-nats"
  listen: $NATS_CLUSTER_ADDR
  advertise: $NATS_CLUSTER_ADDR

  # Do not gossip client URLs. Servers would otherwise hand clients container
  # IPs that host/remote clients cannot reach and TLS cannot verify; clients
  # use exactly the server list they are configured with (README: "Client URLs").
  no_advertise: true

  # Explicit routes are retried forever; the self-route is ignored.
  routes: [
    "nats-route://nats-1-cluster:6222"
    "nats-route://nats-2-cluster:6222"
    "nats-route://nats-3-cluster:6222"
  ]

  tls {
    cert_file: "/etc/nats/certs/server.crt"
    key_file: "/etc/nats/certs/server.key"
    ca_file: "/etc/nats/certs/ca.crt"
    # Routes are always mutually authenticated. Additionally require the peer
    # certificate to carry a SAN matching one of the route URLs above, so a
    # client certificate from the same CA can never pose as a cluster member.
    verify: true
    verify_cert_and_check_known_urls: true
    min_version: "1.2"
    timeout: 2
  }
}

# -----------------------------------------------------------------------------
# JetStream
# -----------------------------------------------------------------------------
jetstream {
  # Each server has its own Docker volume mounted here. Never share it.
  store_dir: "/data"

  # Pin limits to what the container and the volume can really hold; the
  # defaults (75% of host RAM / disk) are wrong inside containers that share
  # one disk.
  max_memory_store: $NATS_JS_MAX_MEMORY
  max_file_store: $NATS_JS_MAX_FILE

  # Durability: the upstream default (2m) relies on replicas living in
  # independent failure domains. Here all three replicas share one kernel,
  # page cache and disk, so a host crash or power loss could drop writes that
  # were already acknowledged. 'always' syncs before the PubAck; NATS 2.15
  # batches these syncs, which makes it affordable for replicated streams.
  # Changing this value needs a (rolling) restart, not a reload.
  sync_interval: always
}

# -----------------------------------------------------------------------------
# Graceful shutdown. Compose sends SIGUSR2 (stop_signal): the server enters
# lame duck mode, hands off Raft leadership, stops accepting connections and
# spreads client disconnects over lame_duck_duration, then exits.
# Keep stop_grace_period in docker-compose.yaml above grace + duration.
# -----------------------------------------------------------------------------
lame_duck_grace_period: "10s"
lame_duck_duration: "30s"

# Logs go to stdout; Docker's json-file driver rotates them (see compose).
logtime: true
logtime_utc: true
# While a peer is down, explicit routes are retried every second; log every
# 30th failed reconnect instead of every one (the default) to keep logs useful.
reconnect_error_reports: 30

include "accounts.conf"
